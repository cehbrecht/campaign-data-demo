project:
  type: default
  output-dir: ../docs/talks
  render:
    - overview.qmd
format:
  revealjs:
    theme: simple
    slide-level: 1
    transition: none
    slide-number: true
    show-slide-number: all
    embed-resources: true
    width: 1600
    height: 900
    margin: 0.06
    center: false
    auto-stretch: false
    pdf-max-pages-per-slide: 1
    code-overflow: wrap
    include-in-header:
      text: |
        <style>
        .reveal { font-family: Arial, Helvetica, sans-serif; font-size: 36px; color: #222; }
        .reveal h1, .reveal h2 { font-family: Arial, Helvetica, sans-serif; color: #457b9d; text-transform: none; }
        .reveal h1 { font-size: 1.65em; margin-bottom: .65em; }
        .reveal a { color: #457b9d; }
        .reveal li { margin-bottom: .55em; }
        .reveal pre { box-shadow: none; background: #dceef8; padding: .5em; }
        .reveal table { font-size: .85em; }
        .reveal .slide-number { font-size: 20px; color: #444; background: transparent; }
        </style>
